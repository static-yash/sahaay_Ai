[project]
name = "voice-chat-bot"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "nandankaryash0-star", email = "nandankaryash0@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.1",
    "google-genai>=2.31.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
    "websockets>=16.1.1",
]

[project.scripts]
voice-chat-bot = "voice_chat_bot:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
